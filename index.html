<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parkdieren</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="./">Parkdieren</a></header><main>
<section id="home"><div class="actions"><button class="primary" id="mix">Mix van 10</button><button id="retry-home">Herhaal fouten <span id="hard-count">0</span></button></div><p class="progress"><span id="seen">0</span> geoefend · <span id="known">0</span> goed</p><div class="topics" id="topics"></div><button id="reset" class="text-button">Voortgang wissen</button></section>
<section id="quiz" hidden><div class="quiz-top"><button class="text-button" id="back">← Onderwerpen</button><span id="quiz-label"></span></div><div class="meter"><div id="bar"></div></div><article><p id="question-count"></p><h1 id="question" tabindex="-1"></h1><div id="answers"></div><div id="feedback" role="status" hidden></div><button class="primary" id="next" hidden>Volgende</button></article></section>
<section id="result" hidden><h1 id="result-title" tabindex="-1"></h1><p id="result-copy" hidden></p><div id="result-detail" hidden></div><div class="actions"><button class="primary" id="retry">Herhaal fouten</button><button id="again">Nieuwe mix</button><button class="text-button" id="done">Onderwerpen</button></div></section>
</main><script src="questions.js"></script><script src="app.js"></script></body></html>
